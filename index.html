    var currentPointIndex = -1;
    var myMap = null;

    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            for (var key in window) {
                if (key.startsWith('map_') && window[key] instanceof L.Map) {
                    myMap = window[key]; break;
                }
            }
        }, 500);

        var ui = document.createElement('div');
        ui.id = 'mobile-nav';
        ui.innerHTML = `
            <button id="btn-locate" class="nav-btn" title="ตำแหน่งของฉัน">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </button>
            <div class="nav-divider"></div>
            <button id="btn-prev" class="nav-btn">❮</button>
            <span id="nav-counter">หน้าหลัก</span>
            <button id="btn-next" class="nav-btn">❯</button>
            <div class="nav-divider"></div>
            <button id="btn-fit">ดูทั้งหมด</button>
        `;
        document.body.appendChild(ui);

        document.getElementById('btn-locate').addEventListener('click', function() {
            var locateBtn = document.querySelector('.leaflet-control-locate a');
            if (locateBtn) {
                locateBtn.click();
            }
        });

        function goToPoint(index) {
            if (!myMap || index < 0 || index >= surveyPoints.length) return;
            currentPointIndex = index;
            var pt = surveyPoints[index];
            
            document.getElementById('nav-counter').innerText = (index + 1) + " / " + surveyPoints.length;
            myMap.flyTo([pt.lat, pt.lon], 21, {animate: true, duration: 0.8});

            setTimeout(function() {
                myMap.eachLayer(function(layer) {
                    if (layer instanceof L.Marker && layer.getLatLng) {
                        var latlng = layer.getLatLng();
                        if (Math.abs(latlng.lat - pt.lat) < 0.00001 && Math.abs(latlng.lng - pt.lon) < 0.00001) {
                            layer.openPopup();
                            document.querySelectorAll('.survey-marker').forEach(m => m.classList.remove('active'));
                            if (layer._icon) {
                                var markerDiv = layer._icon.querySelector('.survey-marker');
                                if (markerDiv) markerDiv.classList.add('active');
                            }
                        }
                    }
                });
            }, 900);
        }

        document.getElementById('btn-prev').addEventListener('click', function() {
            if (currentPointIndex > 0) goToPoint(currentPointIndex - 1);
        });
        document.getElementById('btn-next').addEventListener('click', function() {
            if (currentPointIndex < surveyPoints.length - 1) goToPoint(currentPointIndex + 1);
            else if (currentPointIndex === -1) goToPoint(0);
        });
        document.getElementById('btn-fit').addEventListener('click', function() {
            if (!myMap) return;
            var bounds = L.latLngBounds(surveyPoints.map(p => [p.lat, p.lon]));
            myMap.fitBounds(bounds, {padding: [50, 50]});
            document.getElementById('nav-counter').innerText = "หน้าหลัก";
            document.querySelectorAll('.survey-marker').forEach(m => m.classList.remove('active'));
            myMap.closePopup();
            currentPointIndex = -1;
        });

        document.body.addEventListener('click', function(e) {
            var clickedMarker = e.target.closest('.survey-marker');
            if (clickedMarker) {
                document.querySelectorAll('.survey-marker').forEach(m => m.classList.remove('active'));
                clickedMarker.classList.add('active');
                
                var pointIndex = parseInt(clickedMarker.getAttribute('data-index'));
                if (!isNaN(pointIndex)) {
                    currentPointIndex = pointIndex;
                    document.getElementById('nav-counter').innerText = (pointIndex + 1) + " / " + surveyPoints.length;
                }
            }
        });
    });
